<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nuvola Diary</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { paper:'#F7F6F2', ink:'#23262B', mist:'#8A93A6', sky:'#5B7DB1', dusk:'#E4E8F0' }, fontFamily: { serif:['Georgia','Cambria','serif'] } } } };
</script>
<script src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
<style>
  body { background:#F7F6F2; color:#23262B; font-family: system-ui, sans-serif; }
  button:focus-visible, input:focus-visible, label:focus-within { outline:2px solid #5B7DB1; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="min-h-screen flex flex-col md:flex-row">
  <aside class="md:w-64 md:min-h-screen border-b md:border-b-0 md:border-r border-dusk p-5 flex flex-col gap-4">
    <div class="flex items-center gap-2 font-serif text-2xl">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5B7DB1" stroke-width="2" stroke-linecap="round"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.5 12 3.5 3.5 0 0 0 6 19z"/></svg> Nuvola
    </div>
    <nav class="flex md:flex-col gap-1 text-sm">
      <button id="tab-write" class="rounded-lg px-3 py-2 text-left">Write</button>
      <button id="tab-mood" class="rounded-lg px-3 py-2 text-left">Mood</button>
    </nav>
    <button id="new" class="text-sm text-sky text-left hover:underline">+ New entry</button>
    <ul id="list" class="hidden md:block overflow-y-auto text-sm space-y-1 flex-1"></ul>
    <div class="flex gap-4 text-xs text-mist">
      <button id="export" class="hover:text-ink">Export</button>
      <label class="hover:text-ink cursor-pointer">Import<input id="import" type="file" accept="application/json" class="sr-only" /></label>
    </div>
    <div id="load" class="text-xs text-mist" role="status"></div>
  </aside>

  <main class="flex-1 px-6 md:px-16 py-10 max-w-3xl w-full mx-auto">
    <section id="view-write">
      <input id="title" placeholder="Give today a title" class="w-full bg-transparent font-serif text-3xl outline-none placeholder:text-mist/60" />
      <div class="flex items-center justify-between text-xs text-mist mt-2 mb-4">
        <span id="saved"></span>
        <span class="flex gap-4"><button id="delete" class="hidden hover:text-red-700">Delete</button><button id="preview-toggle" class="hover:underline">Preview markdown</button></span>
      </div>
      <textarea id="text" placeholder="What's on your mind? Markdown works here." class="w-full min-h-[50vh] bg-transparent font-serif text-lg leading-8 outline-none resize-none placeholder:text-mist/60"></textarea>
      <div id="preview" class="hidden font-serif text-lg leading-8 min-h-[50vh]"></div>

      <div class="mt-8 rounded-2xl bg-white/70 border border-dusk p-5" aria-live="polite">
        <div class="flex items-center justify-between">
          <h2 class="font-medium">Local coach</h2>
          <button id="coach-btn" class="text-sm rounded-full bg-sky text-white px-3 py-1.5 disabled:opacity-40">Get feedback</button>
        </div>
        <p id="coach" class="mt-3 text-[15px] leading-7 whitespace-pre-wrap min-h-[3rem]"></p>
        <p id="error" class="mt-2 text-sm text-red-700"></p>
      </div>
    </section>

    <section id="view-mood" class="hidden">
      <h1 class="font-serif text-3xl mb-1">Your mood over time</h1>
      <p class="text-sm text-mist mb-6">100 is very positive. Entries are scored on your device when they're saved.</p>
      <div id="chart"></div>
      <dl id="emotions" class="grid grid-cols-5 gap-3 mt-6 text-center text-sm"></dl>
    </section>
  </main>
</div>

<!-- Web Worker source: runs Transformers.js + WebLLM off the main thread -->
<script id="worker-src" type="text/plain">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
import { CreateMLCEngine } from 'https://esm.run/@mlc-ai/web-llm@0.2.79';

env.allowLocalModels = false;
env.useBrowserCache = true;

const LLM_MODEL = 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC';
const COACH_PROMPT = `You are a warm, private journaling coach. Everything stays on the user's device.
Rules: reply in at most 4 short sentences. Reflect one feeling you notice, validate it, then offer ONE gentle, concrete suggestion or question.
Never diagnose, never give medical advice, never lecture. If the user mentions self-harm, kindly encourage reaching out to a trusted person or local crisis line.`;

// SST-2 only yields positive/negative, so valence is spread across emotions with a small lexicon.
const LEXICON = {
  joy: ['happy','joy','excited','grateful','love','proud','fun','great','wonderful','laugh'],
  sadness: ['sad','cry','lonely','miss','lost','grief','tired','empty','hurt','down'],
  anger: ['angry','mad','furious','annoyed','hate','unfair','frustrated','rage'],
  fear: ['afraid','scared','anxious','worried','nervous','panic','stress','dread'],
  calm: ['calm','peace','relaxed','quiet','rested','content','gentle','slow'],
};
let classifier = null, engine = null, busy = false;
const post = (type, p = {}) => self.postMessage({ type, ...p });

async function loadSentiment() {
  classifier ??= await pipeline('text-classification', 'Xenova/distilbert-base-uncased-finetuned-sst-2-english', {
    progress_callback: (p) => { if (p.status === 'progress') post('progress', { stage: 'sentiment', progress: (p.progress ?? 0) / 100, text: 'Sentiment model: ' + p.file }); },
  });
}
async function loadCoach() {
  if (!('gpu' in navigator)) throw new Error('WebGPU is not available in this browser. Try recent Chrome or Edge.');
  engine ??= await CreateMLCEngine(LLM_MODEL, { initProgressCallback: (r) => post('progress', { stage: 'coach', progress: r.progress, text: r.text }) });
}
async function analyze(id, text) {
  await loadSentiment();
  const [{ label, score }] = await classifier(text.slice(0, 2000));
  const valence = label === 'POSITIVE' ? score : 1 - score;
  const words = text.toLowerCase().match(/[a-z']+/g) ?? [];
  const raw = Object.fromEntries(Object.entries(LEXICON).map(([k, l]) => [k, words.filter((w) => l.includes(w)).length]));
  const bias = { joy: valence, calm: valence * 0.6, sadness: 1 - valence, anger: (1 - valence) * 0.5, fear: (1 - valence) * 0.5 };
  const mix = Object.fromEntries(Object.keys(raw).map((k) => [k, bias[k] + raw[k] * 0.5]));
  const total = Object.values(mix).reduce((a, b) => a + b, 0) || 1;
  const emotions = Object.fromEntries(Object.entries(mix).map(([k, v]) => [k, +(v / total).toFixed(3)]));
  post('sentiment', { id, result: { label, score, valence, emotions } });
}
async function coach(id, text, sentiment) {
  await loadCoach();
  const hint = sentiment ? `\n(Detected tone: ${sentiment.label.toLowerCase()}.)` : '';
  const stream = await engine.chat.completions.create({
    stream: true, temperature: 0.7, max_tokens: 220,
    messages: [{ role: 'system', content: COACH_PROMPT }, { role: 'user', content: `My diary entry:\n"""\n${text.slice(0, 4000)}\n"""${hint}` }],
  });
  let full = '';
  for await (const chunk of stream) {
    const d = chunk.choices[0]?.delta?.content ?? '';
    if (d) { full += d; post('token', { id, delta: d }); }
  }
  post('done', { id, text: full });
}
self.onmessage = async ({ data }) => {
  const { type, id, text, sentiment } = data;
  try {
    if (type === 'analyze') await analyze(id, text);
    else if (type === 'coach') {
      if (busy) return post('error', { id, message: 'Coach is already responding.' });
      busy = true;
      try { await coach(id, text, sentiment); } finally { busy = false; }
    } else if (type === 'interrupt') engine?.interruptGenerate();
    else if (type === 'warmup') { await loadSentiment(); await loadCoach(); post('ready'); }
  } catch (e) { busy = false; post('error', { id, message: e?.message ?? String(e) }); }
};
</script>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const db = new Dexie('nuvola-diary');
  db.version(1).stores({ entries: '++id, timestamp' }); // id, timestamp, title, diaryText, sentimentScore, coachFeedbackText

  let activeId = null, ready = false, streaming = false, timer = null, seq = 0;
  const prog = { sentiment: 0, coach: 0, text: '' };
  const pending = new Map();

  // ---- Worker bridge ----
  const worker = new Worker(URL.createObjectURL(new Blob([$('#worker-src').textContent], { type: 'text/javascript' })), { type: 'module' });
  worker.onmessage = ({ data }) => {
    const p = pending.get(data.id);
    if (data.type === 'progress') { prog[data.stage] = data.progress; prog.text = data.text; renderLoad(); }
    else if (data.type === 'ready') { ready = true; renderLoad(); }
    else if (data.type === 'token') p?.onToken?.(data.delta);
    else if (data.type === 'sentiment' || data.type === 'done') { p?.resolve(data.result ?? data.text); pending.delete(data.id); }
    else if (data.type === 'error') { $('#error').textContent = data.message; p?.reject(new Error(data.message)); pending.delete(data.id); renderLoad(data.message); }
  };
  worker.onerror = (e) => { $('#error').textContent = 'Worker failed to start: ' + (e.message || 'check your connection and serve this page over http://localhost or https.'); };
  const request = (msg, onToken) => new Promise((resolve, reject) => { const id = ++seq; pending.set(id, { resolve, reject, onToken }); worker.postMessage({ ...msg, id }); });

  // ---- Loading UI ----
  function renderLoad(err) {
    const el = $('#load');
    if (ready) { el.textContent = 'Running on your device'; return; }
    const pct = Math.round(((prog.sentiment + prog.coach) / 2) * 100);
    if (!pct && !prog.text) {
      el.innerHTML = '<button id="dl" class="rounded-full bg-sky text-white px-3 py-1.5 hover:opacity-90">Download private models (~1 GB, once)</button>';
      $('#dl').onclick = () => { $('#error').textContent = ''; worker.postMessage({ type: 'warmup' }); prog.text = 'Starting…'; renderLoad(); };
    } else {
      el.innerHTML = `<div class="h-1.5 rounded-full bg-dusk overflow-hidden"><div class="h-full bg-sky" style="width:${pct}%"></div></div><p class="mt-1 truncate">${pct}% · ${esc(prog.text)}</p>${err ? `<p class="mt-1 text-red-700">${esc(err)}</p>` : ''}`;
    }
  }

  // ---- Markdown (escaped first) ----
  const md = (src) => esc(src)
    .replace(/^### (.*)$/gm,'<h3 class="font-serif text-lg mt-3">$1</h3>').replace(/^## (.*)$/gm,'<h2 class="font-serif text-xl mt-4">$1</h2>').replace(/^# (.*)$/gm,'<h1 class="font-serif text-2xl mt-4">$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/^- (.*)$/gm,'<li class="ml-5 list-disc">$1</li>').replace(/\n/g,'<br/>');

  // ---- Entries ----
  async function refreshList() {
    const rows = await db.entries.orderBy('timestamp').reverse().toArray();
    $('#list').innerHTML = rows.length ? rows.map((e) => `<li><button data-id="${e.id}" class="w-full text-left rounded-lg px-3 py-2 truncate ${e.id === activeId ? 'bg-dusk' : 'hover:bg-dusk/60'}"><span class="block truncate">${esc(e.title)}</span><span class="text-xs text-mist">${new Date(e.timestamp).toLocaleDateString()}</span></button></li>`).join('') : '<li class="text-mist px-3">Your entries will appear here.</li>';
    $('#list').querySelectorAll('button').forEach((b) => (b.onclick = () => select(+b.dataset.id)));
  }
  async function select(id) {
    activeId = id;
    const e = id ? await db.entries.get(id) : null;
    $('#title').value = e?.title ?? ''; $('#text').value = e?.diaryText ?? ''; $('#coach').textContent = e?.coachFeedbackText ?? ''; $('#saved').textContent = '';
    $('#delete').classList.toggle('hidden', !id);
    showTab('write'); refreshList();
  }
  async function save() {
    const title = $('#title').value, text = $('#text').value;
    if (!title.trim() && !text.trim()) return;
    const base = { title: title || 'Untitled', diaryText: text };
    if (activeId) await db.entries.update(activeId, base);
    else { activeId = await db.entries.add({ ...base, timestamp: Date.now(), sentimentScore: null, coachFeedbackText: '' }); $('#delete').classList.remove('hidden'); }
    $('#saved').textContent = 'Saved'; refreshList();
    if (ready && text.trim().length > 20) {
      const id = activeId;
      try { await db.entries.update(id, { sentimentScore: await request({ type: 'analyze', text }) }); } catch {}
    }
  }
  const queueSave = () => { $('#saved').textContent = 'Saving…'; clearTimeout(timer); timer = setTimeout(save, 1200); };
  $('#title').oninput = queueSave; $('#text').oninput = queueSave;

  $('#new').onclick = () => select(null);
  $('#delete').onclick = async () => { if (activeId && confirm('Delete this entry permanently? This cannot be undone.')) { await db.entries.delete(activeId); select(null); } };
  $('#preview-toggle').onclick = () => {
    const showing = $('#preview').classList.toggle('hidden') === false;
    $('#text').classList.toggle('hidden', showing);
    $('#preview').innerHTML = md($('#text').value);
    $('#preview-toggle').textContent = showing ? 'Edit' : 'Preview markdown';
  };

  // ---- Coach ----
  const coachBtn = $('#coach-btn');
  coachBtn.onclick = async () => {
    if (streaming) return worker.postMessage({ type: 'interrupt' });
    const text = $('#text').value; if (!text.trim()) return;
    await save();
    streaming = true; coachBtn.textContent = 'Stop'; $('#coach').textContent = ''; $('#error').textContent = '';
    const sentiment = activeId ? (await db.entries.get(activeId))?.sentimentScore : null;
    let acc = '';
    try {
      const final = await request({ type: 'coach', text, sentiment }, (d) => { acc += d; $('#coach').textContent = acc; });
      if (activeId) await db.entries.update(activeId, { coachFeedbackText: final });
    } catch {}
    streaming = false; coachBtn.textContent = 'Get feedback';
  };
  $('#coach').textContent = '';
  $('#coach').dataset.empty = 'Write an entry, then ask for a short, kind reflection. It is generated on your device.';

  // ---- Mood tab ----
  async function renderMood() {
    const rows = (await db.entries.orderBy('timestamp').toArray()).filter((e) => e.sentimentScore);
    const chart = $('#chart'), dl = $('#emotions');
    if (rows.length < 2) { chart.innerHTML = '<p class="text-mist">Save at least two scored entries (with models downloaded) to see a trend.</p>'; dl.innerHTML = ''; return; }
    const W = 640, H = 240, P = 32, n = rows.length;
    const pts = rows.map((e, i) => [P + (i * (W - 2 * P)) / (n - 1), H - P - e.sentimentScore.valence * (H - 2 * P), e]);
    const line = pts.map((p) => p.slice(0, 2).join(',')).join(' ');
    const grid = [0, 50, 100].map((v) => { const y = H - P - (v / 100) * (H - 2 * P); return `<line x1="${P}" x2="${W - P}" y1="${y}" y2="${y}" stroke="#E4E8F0"/><text x="4" y="${y + 4}" font-size="11" fill="#8A93A6">${v}</text>`; }).join('');
    chart.innerHTML = `<div class="rounded-2xl bg-white/70 border border-dusk p-4 overflow-x-auto"><svg viewBox="0 0 ${W} ${H}" class="w-full min-w-[420px]" role="img" aria-label="Mood over time">${grid}<polygon points="${P},${H - P} ${line} ${W - P},${H - P}" fill="#5B7DB1" fill-opacity=".15"/><polyline points="${line}" fill="none" stroke="#5B7DB1" stroke-width="2"/>${pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#5B7DB1"><title>${new Date(p[2].timestamp).toLocaleDateString()}: ${Math.round(p[2].sentimentScore.valence * 100)}</title></circle>`).join('')}<text x="${P}" y="${H - 8}" font-size="11" fill="#8A93A6">${new Date(rows[0].timestamp).toLocaleDateString()}</text><text x="${W - P}" y="${H - 8}" font-size="11" text-anchor="end" fill="#8A93A6">${new Date(rows[n - 1].timestamp).toLocaleDateString()}</text></svg></div>`;
    dl.innerHTML = ['joy','sadness','anger','fear','calm'].map((k) => `<div class="rounded-xl bg-dusk/60 py-3"><dt class="text-mist capitalize">${k}</dt><dd class="text-lg font-serif">${Math.round((rows.reduce((a, e) => a + e.sentimentScore.emotions[k], 0) / n) * 100)}%</dd></div>`).join('');
  }

  // ---- Tabs ----
  function showTab(t) {
    $('#view-write').classList.toggle('hidden', t !== 'write'); $('#view-mood').classList.toggle('hidden', t !== 'mood');
    $('#tab-write').className = `rounded-lg px-3 py-2 text-left ${t === 'write' ? 'bg-dusk font-medium' : 'hover:bg-dusk/60'}`;
    $('#tab-mood').className = `rounded-lg px-3 py-2 text-left ${t === 'mood' ? 'bg-dusk font-medium' : 'hover:bg-dusk/60'}`;
    if (t === 'mood') renderMood();
  }
  $('#tab-write').onclick = () => showTab('write'); $('#tab-mood').onclick = () => showTab('mood');

  // ---- Backup ----
  $('#export').onclick = async () => {
    const blob = new Blob([JSON.stringify(await db.entries.toArray(), null, 2)], { type: 'application/json' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `nuvola-backup-${new Date().toISOString().slice(0, 10)}.json` });
    a.click(); URL.revokeObjectURL(a.href);
  };
  $('#import').onchange = async (e) => {
    const f = e.target.files?.[0]; e.target.value = ''; if (!f) return;
    try {
      const rows = JSON.parse(await f.text()); if (!Array.isArray(rows)) throw 0;
      await db.entries.bulkAdd(rows.map(({ id, ...r }) => ({ title: 'Untitled', diaryText: '', sentimentScore: null, coachFeedbackText: '', timestamp: Date.now(), ...r })));
      refreshList();
    } catch { alert('That file is not a valid Nuvola backup.'); }
  };

  showTab('write'); renderLoad(); refreshList();
})();
</script>
</body>
</html>
